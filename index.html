<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do App</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <header>
        <h1>My Tasks</h1>
    </header>

    <main>
        <form id="task-form">
            <input type="text" id="task-input" placeholder="Add a new task">
            <button type="submit">Add Task</button>
        </form>

        <div class="filters">
            <button id="filter-all" class="active-filter">All</button>
            <button id="filter-active">Active</button>
            <button id="filter-completed">Completed</button>
            
        </div>

        <ul id="task-list"></ul>
        
        <p id="empty-message" class="empty-msg"></p>

        <button id="clear-all" class="clear-btn">Clear All</button>
    </main>

    <footer>
        <p>© 2025 Rehima Yesuf — To-Do App Project</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
